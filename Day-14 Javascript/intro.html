<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Document
    </title>
</head>

<body>
    <!-- As we use Style tag to use CSS Similarly we can use script tag to use JavaScript. 
    We can write JavaScript code inside script tag or we can also link external JavaScript file using src attribute of script tag. -->

    <!-- Script tag can be used in two ways: 1.In head Section 2.In Body Section -->

    <!-- If Script tag is used in Body Section then it should be written after the HTML is code.
But
if Script tag is used in Head Section then it will be executed before the HTML is loaded.
So, it is better to use script tag in Body Section. -->

    <!-- We use JS to add logic and Functionality in the WebPage. -->

    <!--It is a client side programming language which is used to make the webpage dynamic and interactive. 
It is a high level programming language which is used to create web applications.It is a lightweight,
    interpreted, or just - in -time compiled programming language with first - class functions.
It is a multi - paradigm language that supports event - driven, functional, and imperative programming styles.
It has application programming interfaces(APIs) for
working with text, dates, regular expressions, standard data structures, and the Document Object Model(DOM). -->

    <!-- Text - "Text is written in Double Quotes" -->

    <script>
        console.log("Welcome To Head.")

        // Variable - To store Data (var)

        // 1.var keyword

        var username = "john_12"

        console.log(username)

        var password = 12345

        console.log(password)

        // Disadvantage - var keyword allows you to create variable with Same name

        var Deliverycharge = 50

        var Deliverycharge = 30

        console.log(Deliverycharge)


        // 2. let keyword , To Create Variable

        // Advantage - Let keyword don't allow you to create variable with Same name

        //But It can be by Loophole

        let totalbill = 1000

        let cartbill = 100
        console.log(totalbill)

        // Loophole - 
        let email = "john@gmail.com"

        email = "bob@gmail.com"

        console.log(email)


        // 3. const keyword , To Create Variable (Fixed)

        // Advantage - Let keyword don't allow you to create variable with Same name 
        // And No LoopHole Works

        const appName = "Whatsapp"

        console.log(appName)


        //3 Types to Createa Variable
    </script>
</body>

</html>
