<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>
        //DataTypes in JavaScript 
        //Datatypes = Types of Data

        // 1. String Datatype --------> "Anything inside the Single or Double Quotes" - Text

        var customername = "John"

        //Built in methods are like features of a programming language - we can use it directly.
        // typeof(Value)

        console.log(typeof(customername))


        // 2. Number DataType -------> +ve , -ve , Decimal

        var age = 35.00

        //In JS there is nothing like Float,Double it stores all value in same 35 , 35.00 , -35
        console.log(typeof(age))


        // 3. Boolean DataTypes ------> True and False Values      Use small letters for true/fasle No Capitals

        var LoggedIn = true

        console.log(typeof(LoggedIn))


        // 4. Null DataTypes ------------> Nothing

        var a = null

        console.log(typeof(a))


        // NOTE : Due to BUG in JS DataType of Null shows Object as Output.

        // 5. Undefined DataType ------------> When No Value is Assigned.

        var b

        console.log(typeof(b))
    </script>
</body>

</html>
