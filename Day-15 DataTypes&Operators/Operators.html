<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>
        //Operators

        //Operators are used to perform operations on variables and values.

        // 1. Arithmetic Operators -  + , -, *, /, %

        var a = 10
        var b = 7

        console.log(a + b) //17
        console.log(a - b) //3
        console.log(a * b) //70
        console.log(a / b) //1.44

        //Modulo Operator
        console.log(a % b) //3

        console.log(10 % 2) //0
        console.log(1 % 5) //1

        // Note: In Module Left Side > Right Side then Output = Left Side



        //2.Assignment Operators - Used to Assign a Value.(' = ')

        var x = 10

        //Assign And Operation Together

        console.log(x = x + 5)

        console.log(x += 3.5)
        console.log(x -= 2)



        // 3. Comparison Operator

        var p = 25
        var q = 20

        console.log(p > q) //  25 > 20 = true

        console.log(p < q)

        var abc = 10
        var pqr = 10

        console.log(abc <= pqr)


        const height1 = "170" //String
        const height2 = 170 //Number

        // == Only Check The Value Not Data type
        console.log(height1 == height2)


        // ===  Check The Value and Data type Both
        console.log(height1 === height2)


        // 4. Logical Operators - AND , OR , Negation

        // AND Operator - && : IF BOTH CONDITIONS ARE TRUE THEN ONLY OUTPUT IS TRUE.

        var isMember = true

        var TotalPrice = 500

        console.log(isMember && TotalPrice >= 500)


        // OR Operator - || : IF ANYONE CONDITION IS TRUE THEN ONLY OUTPUT IS TRUE.

        var JioHotstarLogin = true

        var PaidSub = false

        console.log("Can Stream IPL For Free: ", JioHotstarLogin || PaidSub)


        // Negation Operator - ! : Opposses the Output

        let NetFlixSubscription = false

        console.log("AmountPaid: ", !NetFlixSubscription)
    </script>
</body>

</html>
