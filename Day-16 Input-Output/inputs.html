<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // Input - Taking Data from User
        // Document - Is Webpage in JavaScript

        // 1. Prompt ('Question')

        var username = prompt('Enter Your Username?')

        console.log("The Name is", username)

        document.write("The Name is ", username) // Output - On Webpage


        // 2. Confirm ('Message')  Ok (True) and  Cancel (False)

        var result = confirm("Are you Sure you want to Exit?")
        console.log(result)
    </script>

</body>

</html>
