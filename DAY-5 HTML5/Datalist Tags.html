<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Datalist Tags -Shows the List of the Data Required to the User Input -->

    <label>Enter your Country: </label>
    <input list="country">

    <datalist id="country">
        <option value="India">
        <option value ="Italy">
        <option value="Iran">
        <option value="Russia">
        <option value="Kenya">
        <option value="Ghana">

    </datalist>
    <br><br>

    <label>Select Food: </label>
    <input list="Foods">

    <datalist id="Foods">
    <option value="Misal">
    <option value="Pav-Bhaji">
    <option value="Medu-Wada">
    </datalist>

</body>

</html>
