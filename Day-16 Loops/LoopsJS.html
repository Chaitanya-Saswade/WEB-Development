<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // ++ Increment/ Increase the Value by 1
        // -- Decrement/ Decrease the Value by 1
        // Break statement is Used to End the Loop At That Condition.

        // Task - To print numbers from 1 to 10

        // LOOPS

        // 1. For Loop
        //Syntax - for(start point ; end point/condition point ; ++ or --) {body - to perform a task}
        // Use for loop when you know the starting and ending conditions.


        // Task1 - To print numbers from 1 to 10 using for loop

        for (let i = 1; i <= 10; i++) { //body
            console.log("The value is:", i)
        }

        // Task2 - To print numbers from 10 to 1 using for loop

        for (let y = 10; y >= 1; y--) {
            console.log("Reverse Order:", y)
        }


        // 2. While Loop / Entry Controlled Loop
        //Syntax - while(condition) { body }

        // When Condition is True Loop will be Start and, Loop will end when conditions is False

        let count = 1

        while (count <= 5) {
            console.log(count)
            count++
        }


        // 3. Do-While Loop / Exit Controlled Loop
        //Syntax - do { body } while(condition/end )

        // It will Execute the Code ATLEAST FOR ONE TIME , Even if Your Condition is False.

        let number = 5

        do {
            console.log("This is a DO-WHILE Loop")
        } while (number < 3)



        //.
    </script>

</body>

</html>
