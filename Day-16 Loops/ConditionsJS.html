<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        //Conditions

        // 1. IF Conditions
        // Syntax - IF(condition) { task }
        // alert() - Is a Method to show Output in the Form of Pop-Up Message.
        //Gives Output only if Condition is True.

        let age = 19

        if (age >= 18) {
            alert("Eligible for DL")
            console.log("Eligible")
        }


        // 2. IF-ELSE Conditions
        // Syntax - IF(condition) { task} else{}
        // alert() - Is a Method to show Output in the Form of Pop-Up Message.

        let age_is = 11

        if (age_is >= 18) {
            alert("Eligible for DL")
            console.log("Eligible")
        } else {
            alert("Not Eligible for DL")
        }



        // 3. ELSE-IF Conditions
        // ELSE-IF Condition is to Apply Multiple Conditions at the Same Time.
        // Syntax - IF(condition){task} else if{task} elseif{task}... else{}

        let temp = 24.99

        if (temp >= 30) {
            alert("It is a Sunny Day")

        } else if (temp > 25) {
            alert("It is Good Day")

        } else if (temp > 20) {
            alert("It is a Sunny Day")

        } else {
            alert("There is Cold Outside")
        }
    </script>

</body>

</html>
