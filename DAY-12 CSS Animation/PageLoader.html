<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            height: 100px;
            width: 100px;
            border: 5px dashed lightblue;
            border-top: 5px solid red;
            border-radius: 50%;
            animation: spin 2s infinite linear;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>
    <div class="box"></div>
</body>

</html>
