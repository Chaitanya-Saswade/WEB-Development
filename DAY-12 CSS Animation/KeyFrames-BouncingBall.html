<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            height: 100px;
            width: 100px;
            background-color: yellow;
            border-radius: 50%;
            animation: bounce 2s infinite alternate;
        }
        
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(100px);
            }
            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>
<!-- border-radius: 50%;     IS used to Convert a box into Circle -->
<!-- Alternate adds delay between 2 animations -->
<!-- ease-in-out makes the  animation smooth -->

</html>
