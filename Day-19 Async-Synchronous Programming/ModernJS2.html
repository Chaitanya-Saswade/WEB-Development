<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //Template String

        //1. Old Way
        var a = "John";
        console.log("My name is ", a)

        // New way
        console.log(`My Name is ${a}`)


        //2. for Functions

        //Old way
        function Message() {}

        //New way   Arrow Function
        var abc = () => {
            console.log("Good Morning")
        }

        abc()

        //3.Set TimeOut
        setTimeout(() => {
            console.log("I will run After 2 Seconds")
        }, 2000)
    </script>

</body>

</html>

</html>
