<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
    <div class="container">
        <h1>Mood Movies Finder</h1>
        <p>Choose your Mood and Get the Movie Recommendation</p>

        <div class="mood">
            <button data-mood="comedy">Happy😊</button>
            <button data-mood="drama">Sad😢</button>
            <button data-mood="action">Excited🤩</button>
            <button data-mood="romance">Romantic🥰</button>
            <button data-mood="horror">Scared💀</button>
        </div>
        <!-- here [data-xyz=] adds data to a html Tag  -->

        <div id="movies-container">


        </div>

    </div>


    <script src="script.js"></script>
    <!-- This is used to connect JavaScript page to the Index page -->
</body>

</html>
