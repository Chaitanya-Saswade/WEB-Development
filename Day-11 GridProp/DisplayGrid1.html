<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .product {
            display: grid;
            grid-template-columns: repeat( 4, 1fr);
            /* Here "1fr" means it arranges block that it uses full screen size properly and 
            the "4" means how much columns we need and
             atmost 12 columns can be added(limited). */
            gap: 20px;
            background-color: lightslategray;
        }
        
        .box {
            background-color: bisque;
            text-align: center;
            border: 1px solid grey;
            padding: 30px;
            font-family: cursive;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="product">
        <div class="box">Cake</div>
        <div class="box">Price</div>
        <div class="box">Cookie</div>
        <div class="box">Price</div>
        <div class="box">Pastry</div>
    </div>
</body>

</html>
