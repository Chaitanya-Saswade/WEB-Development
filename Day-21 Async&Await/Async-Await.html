<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        async function getMovie(movieName) {

            let url = `http://www.omdbapi.com/?t=${movieName}&apikey=fee02d16`

            // TRY is used to get data and CATCH is used to catch the Error.
            try {

                let response = await fetch(url)
                let data = await response.json()

                console.log(data)

                if (data.Response == "True") {

                    console.log(`Title is ${data.Title}`)
                    console.log(`Year: ${data.Year}`)
                    console.log(`Plot: ${data.Plot}`)
                    console.log(`Poster Link  ${data.Poster}`)
                } else {
                    console.log("Movie Not Found.")
                }
            } catch (error) {
                console.log("Error Found,Please Wait.....", error)
            }
        }

        // If wrong Movie Enetered will not be showed.
        getMovie("Dhurandhar")


        function ExtraTask() {
            console.log("Hello Guys, Welcome to Qualifiers")
        }

        ExtraTask()
    </script>

</body>
